<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cole Rollin Pearson</title>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #8a7c7c 0%, #800000 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        width: 100%;
      }

      .card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
      }

      .card-header {
        background:  #570000;
        padding: 40px 30px;
        text-align: center;
        color: white;
      }

      .card-header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: -0.5px;
      }

      .card-header p {
        font-size: 1.1rem;
        opacity: 0.95;
        font-weight: 300;
      }

      .card-body {
        padding: 40px 30px;
        text-align: center;
      }

      .card-body p {
        font-size: 1rem;
        color: #555;
        line-height: 1.8;
        margin-bottom: 20px;
      }

      .divider {
        height: 3px;
        background: linear-gradient(90deg, transparent, #570000, transparent);
        margin: 30px 0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h1>Cole Rollin Pearson</h1>
          <p>Welcome to my portfolio</p>
        </div>
        <div class="divider"></div>
        <div class="card-body">
          <p>I am in the process of creating a web portfolio to showcase my passions and skill sets! Thank you so much for visiting!</p>
        </div>
      </div>
    </div>
  </body>
</html>
