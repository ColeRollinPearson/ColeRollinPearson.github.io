<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cole Rollin Pearson</title>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #8a7c7c 0%, #800000 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
        line-height: 1.6;
        min-height: 100vh;
        display: grid;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
      }

      .card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
      }

      .card-header {
        background:  #570000;
        padding: 40px 30px;
        text-align: center;
        color: white;
      }

      .card-header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: -0.5px;
      }

      .card-header p {
        font-size: 1.1rem;
        opacity: 0.95;
        font-weight: 300;
      }

      .card-body {
        padding: 0px 30px;
        text-align: center;
      }

      .card-body p {
        font-size: 1rem;
        color: #555;
        line-height: 1.8;
        margin-bottom: 20px;
      }

      .divider {
        height: 3px;
        background: linear-gradient(90deg, transparent, #570000, transparent);
        margin: 30px 0;
      }

      .top-link {
        position: fixed;
        top: 5px;
        left: 0px;
        padding: 10px 16px;
        color: #570000;
        text-decoration: none;
        font-weight: 700;
        display: flex;
        gap: 10px;
      }

      .top-link-text {
        left: 0px;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        color: #570000;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        position: relative;
      }

      .top-link-text:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 24px rgba(0, 0, 0, 0.18);
      }
    </style>
  </head>

  <body>
    <div class="top-link">
        <a class="top-link-text" href="index.html">Home</a>
        <a class="top-link-text" href="resume.html">Resume</a>
        <a class="top-link-text" href="https://github.com/ColeRollinPearson" target="_blank">GitHub</a>
        <a class="top-link-text" href="https://www.linkedin.com/in/cole-pearson-3bb061152" target="_blank">LinkedIn</a>
    </div>
    <div style="height: 60px;"></div>
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h1>Cole Rollin Pearson</h1>
          <p>Welcome to my portfolio</p>
        </div>
        <div class="divider"></div>
        <div class="card-body">
          <p>I have created this website to showcase my skillsets and give interested parties easy access to information about myself. Thank you for visiting!</p>
        </div>
        <div class="divider"></div>
      </div>
    </div>
    <div style="height: 20px;"></div>
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h1>Contact Information</h1>
        </div>
        <div class="divider"></div>
        <div class="card-body">
          <p>colerollinpearson@gmail.com</p>
          <p>(210) 623-0092</p>
        </div>
      </div>
    </div>
  </body>
</html>
