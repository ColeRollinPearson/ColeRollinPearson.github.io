<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cole Pearson Resume</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f5f9;
      color: #111827;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #8a7c7c 0%, #800000 100%);
    }
    header {
      padding: 1rem 1.5rem;
      background: #ffffff;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      color: #570000;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    main {
      flex: 1;
      display: grid;
      min-height: 0;
      padding: 1rem;
      background: transparent;
    }
    .viewer {
      width: 100%;
      min-height: 0;
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 16px;
      overflow: hidden;
      background: transparent;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
    }
    .viewer object,
    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      flex: 1;
    }
    .fallback {
      padding: 1.5rem;
      text-align: center;
      background: #f8fafc;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
    }
    .fallback a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .fallback a:hover {
      text-decoration: underline;
    }
    .nav-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cole Pearson Resume Viewer</h1>
    <a class="nav-link" href="index.html">Back to Home</a>
  </header>
  <main>
    <section class="viewer">
      <object data="resume.pdf" type="application/pdf">
        <iframe src="resume.pdf" title="Resume PDF">
          <p>Your browser does not support embedded PDFs.</p>
          <p>You can <a href="resume.pdf">download the resume here</a>.</p>
        </iframe>
      </object>
      <div class="fallback">
        <p>If the PDF does not display, download it directly:</p>
        <p><a href="resume.pdf" download>Download resume.pdf</a></p>
      </div>
    </section>
  </main>
</body>
</html>
